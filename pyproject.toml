[project]
name = "headroom"
version = "0.1.0"
description = "How much housing a state-level reform makes room for: a transparent, replicable capacity-and-uptake model (Housing Data and Technology Innovation Challenge entry)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "requests>=2.31",
    "shapely>=2.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17.2", "cyclonedx-bom>=4"]

[project.scripts]
headroom = "headroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Fixture rows reproduce source files verbatim and are wider than any code line.
"tests/*" = ["E501"]
