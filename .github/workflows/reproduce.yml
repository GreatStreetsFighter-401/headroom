# Reproducibility check.
#
# Re-runs acquisition → build → model from the authoritative sources on a
# schedule and on every push to main, then compares the statewide results with
# the committed reference (out/reference/). A drift means either a source was
# republished (the manifest shows which) or the code changed its answer; both
# are things a reader of the overview should be able to see. Replicable is a
# badge you can click, not a sentence.
#
# The fast gate (unit tests, lint) is ci.yml; this workflow is the slow one.

name: reproduce

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Set up
        run: sh scripts/setup.sh
      - name: Acquire from authoritative sources
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: uv run headroom acquire
      - name: Build and run (all tiers)
        run: |
          uv run headroom build --tier all
          uv run headroom run --tier all
      - name: Compare with committed reference
        run: uv run headroom check
      - name: Generate overview chapters and site data
        run: |
          uv run headroom report
          uv run headroom site
      - name: SBOM (CycloneDX, runtime dependencies; GitHub's own export is the source of truth)
        run: uv run cyclonedx-py environment --of JSON -o sbom.json .venv
      - uses: actions/upload-artifact@v4
        with:
          name: headroom-outputs
          path: |
            out/*.json
            cache/manifest.json
            docs/generated/
            sbom.json
